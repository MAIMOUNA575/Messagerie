<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messagerie</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef2f1;
      color: #1d2b29;
      display: flex;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 560px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid #e3eae8;
      font-weight: 600;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .vide { color: #6b7c79; text-align: center; margin-top: 24px; }
    .bulle {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px;
      background: #e3eae8;
      align-self: flex-start;
      overflow-wrap: anywhere;
    }
    .bulle.moi {
      background: #1f6f64;
      color: #ffffff;
      align-self: flex-end;
    }
    .auteur { font-size: 12px; color: #6b7c79; margin-bottom: 2px; }
    .bulle.moi .auteur { color: #cfe6e2; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e3eae8;
    }
    input {
      flex: 1;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid #c5d0cd;
      border-radius: 10px;
      min-width: 0;
    }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #1f6f64;
      color: #ffffff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <header>Messagerie</header>
    <div id="messages">
      <p class="vide" id="vide">Aucun message. Écris le premier.</p>
    </div>
    <form id="formulaire">
      <input id="texte" placeholder="Ton message" autocomplete="off" maxlength="500" required>
      <button type="submit">Envoyer</button>
    </form>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // On demande le pseudo une seule fois et on le retient
    let pseudo = localStorage.getItem("pseudo");
    if (!pseudo) {
      pseudo = (prompt("Quel est ton prénom ou pseudo ?") || "Anonyme").trim() || "Anonyme";
      localStorage.setItem("pseudo", pseudo);
    }

    const zone = document.getElementById("messages");
    const formulaire = document.getElementById("formulaire");
    const champ = document.getElementById("texte");

    // Affiche un message à l'écran
    function afficher(m) {
      const vide = document.getElementById("vide");
      if (vide) vide.remove();

      const bulle = document.createElement("div");
      bulle.className = "bulle" + (m.pseudo === pseudo ? " moi" : "");

      const heure = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

      const auteur = document.createElement("div");
      auteur.className = "auteur";
      auteur.textContent = m.pseudo + " à " + heure;

      const texte = document.createElement("div");
      texte.textContent = m.texte;
;
      bulle.append(auteur, texte);
      zone.append(bulle);
      zone.scrollTop = zone.scrollHeight;
    }

    // Quand le serveur nous envoie un message, on l'affiche
    socket.on("message", afficher);

    // Quand on clique sur "Envoyer", on envoie le message au serveur
    formulaire.addEventListener("submit", (e) => {
      e.preventDefault();
      const texte = champ.value.trim();
      if (!texte) return;
      socket.emit("message", { pseudo: pseudo, texte: texte });
      champ.value = "";
      champ.focus();
    });
  </script>
</body>
</html>
